services:
  command-os-api:
    build: .
    container_name: command-os-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      MONGO_URL: mongodb://mongo-db:27017
      MONGO_DB_NAME: command_os
      REDIS_URL: redis://redis-cache:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    volumes:
      - app-data:/app/data
    depends_on:
      - mongo-db
      - redis-cache
    restart: unless-stopped

  mongo-db:
    image: mongo:7
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  app-data:
  redis-data:
