<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis-V1 Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0f1419;
        --panel: #182029;
        --ink: #e8eef4;
        --muted: #8fa3b5;
        --accent: #3dd6c6;
        --warn: #f0a500;
        --line: #2a3947;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1d3a45 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #24301f 0%, transparent 50%),
          var(--bg);
        min-height: 100vh;
      }
      header {
        padding: 2rem 1.5rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.03em;
      }
      .sub { color: var(--muted); margin-top: 0.4rem; }
      main {
        display: grid;
        gap: 1rem;
        padding: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      section {
        background: color-mix(in srgb, var(--panel) 92%, black);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem;
        min-height: 220px;
      }
      h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--accent); }
      ul { margin: 0; padding-left: 1.1rem; max-height: 220px; overflow: auto; }
      li { margin: 0.25rem 0; font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
      button, input, select, textarea {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #10171e;
        color: var(--ink);
        padding: 0.45rem 0.65rem;
      }
      button { background: var(--accent); color: #062421; font-weight: 600; cursor: pointer; }
      textarea { width: 100%; min-height: 70px; }
      .status { color: var(--muted); font-size: 0.85rem; }
      .ok { color: var(--accent); }
      .warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <header>
      <h1>Jarvis-V1</h1>
      <p class="sub">Local CommandOS dashboard — commands, workflows, rules, approvals</p>
      <div class="row">
        <button id="connect">Connect (dev token)</button>
        <span id="health" class="status">offline</span>
      </div>
    </header>
    <main>
      <section>
        <h2>Commands</h2>
        <ul id="commands"></ul>
      </section>
      <section>
        <h2>Workflows</h2>
        <ul id="workflows"></ul>
        <div class="row">
          <select id="wfName"></select>
          <button id="runWf">Run</button>
        </div>
      </section>
      <section>
        <h2>Rule Editor</h2>
        <input id="ruleName" placeholder="Rule name" />
        <textarea id="ruleJson" placeholder='[{"field":"job.salary.min","operator":"GREATER_THAN_OR_EQUAL","value":100000}]'></textarea>
        <div class="row"><button id="saveRule">Save rule</button></div>
        <ul id="rules"></ul>
      </section>
      <section>
        <h2>Approvals</h2>
        <ul id="approvals"></ul>
      </section>
    </main>
    <script>
      let token = "";
      const headers = () => ({
        Authorization: `Bearer ${token}`,
        "content-type": "application/json",
      });

      async function api(path, opts = {}) {
        const res = await fetch(`/api${path}`, {
          ...opts,
          headers: { ...(opts.headers || {}), ...headers() },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.message || res.statusText);
        return data;
      }

      async function connect() {
        const data = await fetch("/api/auth/dev-token", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ userId: "dashboard-user" }),
        }).then((r) => r.json());
        token = data.token;
        document.getElementById("health").textContent = "connected";
        document.getElementById("health").className = "status ok";
        await refresh();
      }

      async function refresh() {
        const health = await fetch("/api/health").then((r) => r.json());
        document.getElementById("health").textContent =
          `db:${health.checks.database} cache:${health.checks.cache}`;

        const summary = await api("/dashboard/summary");
        document.getElementById("commands").innerHTML = summary.commands
          .map((c) => `<li>${c}</li>`)
          .join("");
        document.getElementById("workflows").innerHTML = summary.workflows
          .map((w) => `<li>${w}</li>`)
          .join("");
        document.getElementById("wfName").innerHTML = summary.workflows
          .map((w) => `<option value="${w}">${w}</option>`)
          .join("");
        document.getElementById("approvals").innerHTML = (summary.approvals || [])
          .map(
            (a) =>
              `<li>${a.command} <button data-id="${a.id}" class="approve">Approve</button></li>`,
          )
          .join("") || "<li>None pending</li>";

        const rules = await api("/rules");
        document.getElementById("rules").innerHTML = (rules.rules || [])
          .map((r) => `<li>${r.name} (${r.logical_operator || r.logicalOperator || "AND"})</li>`)
          .join("");

        document.querySelectorAll(".approve").forEach((btn) => {
          btn.onclick = async () => {
            await api(`/approvals/${btn.dataset.id}/resolve`, {
              method: "POST",
              body: JSON.stringify({ decision: "APPROVED" }),
            });
            await refresh();
          };
        });
      }

      document.getElementById("connect").onclick = () => connect().catch(alert);
      document.getElementById("runWf").onclick = async () => {
        const name = document.getElementById("wfName").value;
        const payload =
          name === "career.job-application"
            ? {
                keywords: ["TypeScript"],
                location: "Remote",
                resumeId: "primary-resume-1",
                minSalary: 100000,
              }
            : name === "system.demo"
              ? { message: "hi", followUp: "there" }
              : {};
        const result = await api("/workflows", {
          method: "POST",
          body: JSON.stringify({ name, payload }),
        });
        alert(`${name}: ${result.status}`);
        await refresh();
      };
      document.getElementById("saveRule").onclick = async () => {
        const name = document.getElementById("ruleName").value || "untitled-rule";
        const conditions = JSON.parse(
          document.getElementById("ruleJson").value || "[]",
        );
        await api("/rules", {
          method: "POST",
          body: JSON.stringify({ name, logicalOperator: "AND", conditions }),
        });
        await refresh();
      };
    </script>
  </body>
</html>
